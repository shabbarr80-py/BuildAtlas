[project]
name = "buildatlas-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.13", "pydantic-settings>=2.5", "python-jose[cryptography]>=3.3", "pwdlib[argon2]>=0.2", "httpx>=0.27", "email-validator>=2.2"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
ignore = ["B008", "BLE001", "FURB162", "UP017"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
