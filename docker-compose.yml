services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildatlas}
      POSTGRES_USER: ${POSTGRES_USER:-buildatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildatlas}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildatlas} -d ${POSTGRES_DB:-buildatlas}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://buildatlas:buildatlas@db:5432/buildatlas}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
